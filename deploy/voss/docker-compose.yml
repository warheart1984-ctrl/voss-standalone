services:
  voss-model-router:
    build:
      context: ./router/service/go
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - VOSS_MODE=router
      - VOSS_CONFIG=/config/tenants.production.json
      - VOSS_ADDR=:8080
      - VOSS_OPERATOR_TOKEN=${VOSS_OPERATOR_TOKEN:?set VOSS_OPERATOR_TOKEN in .env}
      - VOSS_ENABLE_PROJECT_INFINITY=${VOSS_ENABLE_PROJECT_INFINITY:-false}
      - VOSS_INFERENCE_URL=${VOSS_INFERENCE_URL:-http://infinity:8000}
    volumes:
      - ./config/tenants.production.json:/config/tenants.production.json:ro
    depends_on:
      voss-usl-gate:
        condition: service_healthy
      voss-gre-1001:
        condition: service_healthy
      voss-ledger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - voss-net

  voss-usl-gate:
    build:
      context: ./router/service/go
      dockerfile: Dockerfile
    environment:
      - VOSS_MODE=usl-gate
      - VOSS_CONFIG=/config/tenants.production.json
      - VOSS_ADDR=:8080
    volumes:
      - ./config/tenants.production.json:/config/tenants.production.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - voss-net

  voss-gre-1001:
    build:
      context: ./router/service/go
      dockerfile: Dockerfile
    environment:
      - VOSS_MODE=gre-1001
      - VOSS_CONFIG=/config/tenants.production.json
      - VOSS_ADDR=:8080
    volumes:
      - ./config/tenants.production.json:/config/tenants.production.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - voss-net

  voss-ledger:
    build:
      context: ./router/service/go
      dockerfile: Dockerfile
    environment:
      - VOSS_MODE=ledger
      - VOSS_ADDR=:8080
      - VOSS_LEDGER_DIR=/data
      - VOSS_OPERATOR_TOKEN=${VOSS_OPERATOR_TOKEN:?set VOSS_OPERATOR_TOKEN in .env}
    volumes:
      - ./data/ledger:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - voss-net

  voss-drift-detector:
    build:
      context: ./router/service/go
      dockerfile: Dockerfile
    environment:
      - VOSS_MODE=drift-detector
      - VOSS_ADDR=:8080
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - voss-net

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./config/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml
    networks:
      - voss-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - voss-net

networks:
  voss-net:
    driver: bridge
