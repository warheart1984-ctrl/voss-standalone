services:
  voss-model-router:
    build:
      context: ./router/service/go
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - VOSS_CONFIG=/config/tenants.production.json
      - VOSS_ADDR=:8080
    volumes:
      - ./config/tenants.production.json:/config/tenants.production.json
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/metrics"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - voss-net

  voss-usl-gate:
    image: voss/usl-gate:latest
    # Phase 5: replace with buildable local service; USL logic lives in the router module today.
    networks:
      - voss-net

  voss-gre-1001:
    image: voss/gre-1001:latest
    # Phase 5: replace with buildable local service; GRE-1001 lives in the router module today.
    networks:
      - voss-net

  voss-ledger:
    image: voss/ledger:latest
    # Phase 5: replace with buildable local service; ledger lives in the router module today.
    volumes:
      - ./data/ledger:/data
    networks:
      - voss-net

  voss-drift-detector:
    image: voss/drift-detector:latest
    # Phase 5: replace with buildable local service.
    networks:
      - voss-net

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./config/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml
    networks:
      - voss-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - voss-net

networks:
  voss-net:
    driver: bridge
